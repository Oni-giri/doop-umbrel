name: Publish Doop image

on:
  push:
    tags:
      - "v*"
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      upstream_ref:
        description: Upstream Doop tag or commit
        required: false
        default: ""
        type: string
      image_tag:
        description: Image tag to publish
        required: false
        default: ""
        type: string

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out packaging
        uses: actions/checkout@v4
      - name: Resolve upstream server release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          ref="${{ inputs.upstream_ref }}"
          tag="${{ inputs.image_tag }}"
          if [ -z "$ref" ]; then
            ref="$(gh api repos/kgoedecke/doop/tags --paginate --jq '.[].name' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1)"
          fi
          if [ -z "$tag" ]; then tag="${ref#v}"; fi
          printf 'ref=%s\ntag=%s\n' "$ref" "$tag" >> "$GITHUB_OUTPUT"
      - name: Check out upstream release
        uses: actions/checkout@v4
        with:
          repository: kgoedecke/doop
          ref: ${{ steps.release.outputs.ref }}
          path: upstream
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/oni-giri/doop-umbrel
          tags: |
            type=raw,value=${{ steps.release.outputs.tag }}
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: upstream
          file: upstream/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
