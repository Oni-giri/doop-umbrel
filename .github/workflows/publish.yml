name: Publish Doop image

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      upstream_ref:
        description: Upstream Doop tag or commit
        required: true
        default: v0.14.0
        type: string
      image_tag:
        description: Image tag to publish
        required: true
        default: 0.14.0
        type: string

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out packaging
        uses: actions/checkout@v4
      - name: Check out upstream release
        uses: actions/checkout@v4
        with:
          repository: kgoedecke/doop
          ref: ${{ inputs.upstream_ref || github.ref_name }}
          path: upstream
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/oni-giri/doop-umbrel
          tags: |
            type=match,pattern=v(.*),group=1,enable=${{ github.event_name == 'push' }}
            type=raw,value=${{ inputs.image_tag }},enable=${{ github.event_name == 'workflow_dispatch' }}
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: upstream
          file: upstream/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
